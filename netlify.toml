# Sito di studio statico: nessuna build, si pubblica così com'è la cartella antirez/study.
[build]
  publish = "antirez/study"

# Contenuti che cambiano spesso (note, schede, dati): sempre rivalidati, così una
# correzione pushata si vede al primo ricaricamento.
[[headers]]
  for = "/notes/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/markdown; charset=utf-8"

# Turni della conversazione con Gemini (tools/split_turns.py): markdown, come le note.
# Vale anche per turns/index.json e turns/corrections.json: il sito li legge come testo
# (fetch + JSON.parse), quindi il Content-Type markdown non dà problemi, e max-age=0 fa
# vedere subito un corrections.json rigenerato.
[[headers]]
  for = "/turns/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS del sito: cache breve (5 minuti) perché i file non hanno hash nel nome.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
